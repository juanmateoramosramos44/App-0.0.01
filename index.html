<!doctype html>
<html lang="es" class="notranslate" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="googlebot" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mantenimiento Hotelero & Bombas</title>
    <meta name="description" content="Sistema integral de gestión de mantenimiento hotelero con sincronización en tiempo real entre compañeros y dispositivos para reportes de averías, rondas técnicas, bombas e inspecciones." />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mantenim." />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <meta property="og:title" content="Mantenimiento Hotelero & Bombas" />
    <meta property="og:description" content="Sistema integral de gestión de mantenimiento hotelero con sincronización en tiempo real entre compañeros y dispositivos para reportes de averías, rondas técnicas, bombas e inspecciones." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root">
      <!-- Indicador visual inicial mientras React inicializa (evita pantalla en blanco) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #070c18; color: white; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 80px; height: 80px; border-radius: 22px; background: linear-gradient(180deg, #0f172a 0%, #050811 100%); border: 1.5px solid rgba(56, 189, 248, 0.35); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 210, 255, 0.2); padding: 10px;">
          <img src="/images/app_logo.jpg" alt="Logo" style="width: 100%; height: 100%; object-fit: contain; border-radius: 14px;" onerror="this.src='/app-logo.svg';" />
        </div>
        <h1 style="font-size: 1.25rem; font-weight: 700; margin: 0 0 6px 0; letter-spacing: -0.02em; color: #f8fafc;">Mantenimiento Hotelero</h1>
        <p style="font-size: 0.85rem; color: #38bdf8; margin: 0 0 24px 0; font-weight: 500;">Iniciando sistema...</p>
        <div style="width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #00f0ff; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
