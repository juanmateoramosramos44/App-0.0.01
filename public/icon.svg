<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00a3ff" />
    </linearGradient>
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="90" fill="url(#bgGrad)" />

  <!-- Orbital Ring 1 (Behind) -->
  <ellipse cx="230" cy="270" rx="170" ry="140" fill="none" stroke="#00d2ff" stroke-width="6" transform="rotate(-30 230 270)" filter="url(#neonGlow)" opacity="0.85" />

  <!-- Laptop Base & Screen Outer (Emerald Neon) -->
  <!-- Screen Body -->
  <rect x="135" y="195" width="195" height="150" rx="22" fill="#091422" stroke="#10b981" stroke-width="8" />
  
  <!-- Screen Inner Bezel -->
  <rect x="145" y="205" width="175" height="130" rx="14" fill="#040a14" />

  <!-- Laptop Base/Keyboard Deck -->
  <path d="M 120 365 L 345 365 C 345 376, 335 385, 320 385 L 145 385 C 130 385, 120 376, 120 365 Z" fill="#10b981" />
  <rect x="205" y="365" width="55" height="6" rx="3" fill="#040a14" />

  <!-- Small Gear 1 inside Screen -->
  <g transform="translate(185, 255)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="5" />
    <path d="M-4 -20 h8 v6 h-8 z M-4 14 h8 v6 h-8 z M-20 -4 h6 v8 h-6 z M14 -4 h6 v8 h-6 z M-15 -15 l5 5 l-4 4 l-5 -5 z M10 10 l5 5 l-4 4 l-5 -5 z M-15 10 l5 -5 l4 4 l-5 5 z M10 -15 l5 5 l-4 4 l-5 -5 z" fill="#38bdf8" />
    <circle cx="0" cy="0" r="6" fill="#040a14" />
  </g>

  <!-- Medium Gear 2 inside Screen -->
  <g transform="translate(235, 295)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" stroke-width="6" />
    <path d="M-5 -25 h10 v7 h-10 z M-5 18 h10 v7 h-10 z M-25 -5 h7 v10 h-7 z M18 -5 h7 v10 h-7 z M-19 -19 l6 6 l-5 5 l-6 -6 z M13 13 l6 6 l-5 5 l-6 -6 z M-19 13 l6 -6 l5 5 l-6 6 z M13 -19 l6 6 l-5 5 l-6 -6 z" fill="#38bdf8" />
    <circle cx="0" cy="0" r="8" fill="#040a14" />
  </g>

  <!-- Large Main Gear (Top Right of Laptop) -->
  <g transform="translate(325, 235)" filter="url(#neonGlow)">
    <circle cx="0" cy="0" r="48" fill="url(#gearGrad)" />
    
    <!-- 8 Gear Teeth -->
    <rect x="-11" y="-62" width="22" height="18" rx="4" fill="url(#cyanNeon)" />
    <rect x="-11" y="44" width="22" height="18" rx="4" fill="url(#cyanNeon)" />
    <rect x="-62" y="-11" width="18" height="22" rx="4" fill="url(#cyanNeon)" />
    <rect x="44" y="-11" width="18" height="22" rx="4" fill="url(#cyanNeon)" />
    
    <g transform="rotate(45)">
      <rect x="-11" y="-62" width="22" height="18" rx="4" fill="url(#cyanNeon)" />
      <rect x="-11" y="44" width="22" height="18" rx="4" fill="url(#cyanNeon)" />
      <rect x="-62" y="-11" width="18" height="22" rx="4" fill="url(#cyanNeon)" />
      <rect x="44" y="-11" width="18" height="22" rx="4" fill="url(#cyanNeon)" />
    </g>

    <!-- Gear Body -->
    <circle cx="0" cy="0" r="46" fill="url(#cyanNeon)" />
    <circle cx="0" cy="0" r="28" fill="#091422" stroke="#00f0ff" stroke-width="4" />
    <circle cx="0" cy="0" r="14" fill="#040a14" />
  </g>

  <!-- Orbital Loop (Front pass) -->
  <path d="M 220 420 C 320 440, 400 370, 360 280" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 120 180 C 130 130, 240 120, 290 170" fill="none" stroke="#00d2ff" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
</svg>
